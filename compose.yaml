services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_SHOW_DEMO_CASES: ${VITE_SHOW_DEMO_CASES:-true}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    develop:
      watch:
        - action: rebuild
          path: ./backend
    environment:
      PORT: 3000
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      CASE_DELETE_TOKEN: ${CASE_DELETE_TOKEN:-local-dev-delete-only}
      BUCKET_NAME: ${BUCKET_NAME:-refratia}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_ENDPOINT_URL_S3: ${AWS_ENDPOINT_URL_S3:-http://minio:9000}
      AWS_PUBLIC_ENDPOINT_URL_S3: ${AWS_PUBLIC_ENDPOINT_URL_S3:-http://localhost:9000}
      AWS_EC2_METADATA_DISABLED: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
    ports:
      - "3000:3000"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: docker.io/pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/refratia"

volumes:
  minio_data:
