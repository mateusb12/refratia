services:
  frontend:
    build:
      dockerfile: frontend/Dockerfile.dev
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_SHOW_DEMO_CASES: ${VITE_SHOW_DEMO_CASES:-true}
    working_dir: /app
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173 --base /
    ports:
      - "5173:5173"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/src
    working_dir: /src
    command: ["/usr/local/bin/refratia-dev-server"]

volumes:
  frontend_node_modules:
