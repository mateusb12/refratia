name: Deploy GitHub Pages
run-name: "Deploy RefratIA #${{ github.run_number }} · ${{ github.sha }}"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve application version
        id: version
        shell: bash
        run: |
          version_series="$(
            node -e "
              const [major, minor] = require('./package.json')
                .version
                .split('.')

              process.stdout.write(major + '.' + minor)
            "
          )"

          version="${version_series}.${GITHUB_RUN_NUMBER}"
          commit_short="${GITHUB_SHA:0:7}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "VITE_APP_VERSION=${version}" >> "$GITHUB_ENV"
          echo "VITE_COMMIT_SHA=${commit_short}" >> "$GITHUB_ENV"

          echo "Versão: v${version}"
          echo "Commit: ${commit_short}"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Create version metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs'

          const metadata = {
            version: process.env.VERSION,
            commit: process.env.COMMIT_SHA,
            runId: process.env.RUN_ID,
            runNumber: Number(process.env.RUN_NUMBER),
            builtAt: new Date().toISOString(),
          }

          writeFileSync(
            'dist/version.json',
            `${JSON.stringify(metadata, null, 2)}\n`,
          )
          NODE

          echo "Metadados gerados:"
          cat dist/version.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  version:
    name: Register v${{ needs.build.outputs.version }}
    needs:
      - build
      - deploy

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Create version tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v${VERSION}"

          if gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" \
              >/dev/null 2>&1
          then
              echo "A tag ${tag} já existe."
          else
              gh api \
                  --method POST \
                  "repos/${GITHUB_REPOSITORY}/git/refs" \
                  -f "ref=refs/tags/${tag}" \
                  -f "sha=${GITHUB_SHA}"

              echo "Tag criada: ${tag}"
          fi

          echo
          echo "Versão publicada: ${tag}"
          echo "Commit: ${GITHUB_SHA}"
